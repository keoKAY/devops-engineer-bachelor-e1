services:
  frontend:
    # build directive: use Dockerfile to build img
    build:
      context: frontend 
      dockerfile: Dockerfile 
    pull_policy: build
    image: lyvann544/frontend-image:latest
    container_name: frontend-cont  
    networks:
      - fullstack-net 
    ports:
      - 3000:80
  backend: 
    build:
      context: backend 
      dockerfile: dev.Dockerfile
    pull_policy: build
    container_name: backend-cont
    image: lyvanna544/backend-image
    depends_on:
      - database
    networks:
      - fullstack-net
  database: 
    image: postgres
    container_name: postgres-cont
    environment:
      - POSTGRES_PASSWORD=postgres123
    volumes:
      - database-vol:/var/lib/postgresql
    networks:
      - fullstack-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
volumes:
  database-vol: 
networks:
  fullstack-net:


