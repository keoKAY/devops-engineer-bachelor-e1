services: 
  wordpress-svc: 
    container_name: wordpress-cont
    image: wordpress
    restart: always # auto start when boot
    ports:
      - 3005:80
    environment:
      - WORDPRESS_DB_HOST=mysql-svc
      - WORDPRESS_DB_USER=${DB_USER}
      - WORDPRESS_DB_PASSWORD=${DB_PASSWORD}
      - WORDPRESS_DB_NAME=${DB_DATABASE}
    depends_on:
      - mysql-svc # condition healthy 
    volumes:
      - wordpress-vol:/var/www/html
    networks:
      - wordpress-net
  mysql-svc: 
    container_name: mysql-cont
    image: mysql
    environment:
      - MYSQL_USER=${DB_USER}
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
    volumes:
      - mysql-vol:/var/lib/mysql  
    networks:
      - wordpress-net 
    ports:
      - "3306:3306"
volumes:
  wordpress-vol:
  mysql-vol:
networks:
  wordpress-net: 